# dsh-startup-machine — DSH bundle patch
#
# 只把 Host 半侧挂进当前 profile 的配置树；Web 半侧由 package.json 的
# dsh.client 声明，宿主会自动组装，这里不用写。
#
# 安装（不要手改 profile patch）：跑 install.cmd，或
#   dsh plugin --profile desktop add link:<本目录绝对路径，用正斜杠>
# 卸掉自带的启动画面（否则两层叠着跑）：
#   dsh plugin --profile desktop remove dsh-startup-screen
- insert:
    - id: dsh-startup-machine
      name: dsh-startup-machine
