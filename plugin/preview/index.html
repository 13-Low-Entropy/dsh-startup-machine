<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-startup-machine · 启动动画预览</title>
<link rel="stylesheet" href="../lib/splash.css">
<style>
  /* 假的 DSH 主界面：只为让「揭幕淡出」有东西可露出来 */
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0b0f14;
    color: #cfd8e3;
    font: 13px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif;
    overflow: hidden;
  }
  .app { display: grid; grid-template-columns: 232px 1fr; height: 100vh }
  .side {
    border-right: 1px solid #1b2530;
    background: #0d1218;
    padding: 14px 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .side .logo { font-size: 12px; letter-spacing: .16em; color: #7f8fa3; margin-bottom: 6px }
  .side .item {
    padding: 8px 10px; border-radius: 8px; color: #8b9aad; font-size: 12px;
    border: 1px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side .item.on { background: #141c25; border-color: #223141; color: #d7e3ec }
  .main { display: flex; flex-direction: column }
  .top { height: 46px; border-bottom: 1px solid #1b2530; display: flex; align-items: center; padding: 0 18px; color: #7f8fa3; font-size: 12px; letter-spacing: .1em }
  .blank { flex: 1; display: flex; align-items: center; justify-content: center; color: #37465a; font-size: 12px; letter-spacing: .22em }
  .composer { margin: 0 auto 26px; width: min(720px, 82%); border: 1px solid #223141; border-radius: 12px; padding: 14px 16px; color: #4d5c70; font-size: 12px; background: #0e141b }

  /* 预览工具条：必须盖在启动层之上（启动层 z-index 2147483000） */
  #bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 2147483100;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 999px;
    background: rgba(10, 14, 20, .82);
    border: 1px solid #253242;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .55);
    backdrop-filter: blur(6px);
    font: 12px/1 ui-monospace, Consolas, monospace;
  }
  #bar button {
    background: #131c26; color: #cfd8e3; border: 1px solid #253242;
    border-radius: 999px; padding: 7px 13px; cursor: pointer; font: inherit; letter-spacing: .06em;
  }
  #bar button:hover { border-color: #4a6b86; color: #fff }
  #bar .tag { color: #5d7086; padding: 0 6px; letter-spacing: .12em; font-size: 10px }

  #cfg {
    position: fixed; right: 16px; top: 16px; z-index: 2147483101;
    width: min(420px, 92vw); max-height: 70vh; display: none;
    flex-direction: column; gap: 8px;
    background: #0b1117; border: 1px solid #253242; border-radius: 10px; padding: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
  }
  #cfg.open { display: flex }
  #cfg textarea {
    width: 100%; height: 44vh; resize: vertical;
    background: #05080c; color: #b9c6d2; border: 1px solid #1e2c3a; border-radius: 8px;
    font: 11px/1.6 ui-monospace, Consolas, monospace; padding: 10px; outline: none;
  }
  #cfg .row { display: flex; gap: 8px; align-items: center; justify-content: flex-end }
  #cfg .hint { font-size: 11px; color: #5d7086; line-height: 1.6 }
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="logo">DEEPSEEK HARNESS</div>
    <div class="item on">启动动画插件调试</div>
    <div class="item">把 dsh-theme-machine 装上会更像</div>
    <div class="item">第二幕会调用摄像头</div>
    <div class="item">Esc 一键跳过</div>
    <div class="item" style="margin-top:auto;font-size:11px;color:#44566b">这是假界面，只为看淡出</div>
  </aside>
  <main class="main">
    <div class="top">PREVIEW · 启动动画在真正的 DSH 上会在应用挂载前盖住这一层</div>
    <div class="blank">DEEPSEEK HARNESS</div>
    <div class="composer">问点什么…</div>
  </main>
</div>

<div id="bar">
  <span class="tag">PREVIEW</span>
  <button id="btn-replay" type="button">重播</button>
  <button id="btn-skip" type="button">跳过</button>
  <button id="btn-cfg" type="button">配置</button>
  <button id="btn-camera" type="button">摄像头权限</button>
</div>

<div id="cfg">
  <div class="hint">改完点「应用并重播」：只写在本机 localStorage，不影响插件配置。<br>
    可用字段与 ~/.dsh/dsh-startup-machine.json 完全一致。</div>
  <textarea id="cfg-text" spellcheck="false"></textarea>
  <div class="row">
    <button id="cfg-reset" type="button">清空覆盖</button>
    <button id="cfg-apply" type="button">应用并重播</button>
  </div>
</div>

<script src="../lib/face-track.js"></script>
<script src="../lib/face-track-gl.js"></script>
<script src="../lib/hud-draw.js"></script>
<script src="../lib/eye-track.js"></script>
<script src="../lib/face-landmark.js"></script>
<script>/* 人脸网格模型的本地目录（相对本页）；用 file:// 直接打开时浏览器会拦模块加载，
   请用 preview.cmd 起的 127.0.0.1:8917 打开本页，那时网格引擎才生效 */
window.__DSH_MACHINE_ASSETS__ = '../assets/mp/';
window.__DSH_MACHINE_AVATAR__ = '../assets/avatar/default.jpg';
</script>
<script src="preview.js"></script>
</body>
</html>
